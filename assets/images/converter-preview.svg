<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgConv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="convGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1200" height="675" fill="url(#bgConv)"/>
  
  <!-- Mesh Glow -->
  <circle cx="600" cy="200" r="280" fill="#4f46e5" opacity="0.18" filter="url(#convGlow)"/>
  <circle cx="950" cy="450" r="180" fill="#10b981" opacity="0.12" filter="url(#convGlow)"/>
  
  <!-- Browser Window Mockup -->
  <g transform="translate(80, 50)">
    <rect width="1040" height="575" rx="16" fill="#0f1117" stroke="#2e3348" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="1040" height="44" rx="16" fill="#1a1d27"/>
    <rect y="24" width="1040" height="20" fill="#1a1d27"/>
    <line x1="0" y1="44" x2="1040" y2="44" stroke="#2e3348" stroke-width="1"/>
    
    <circle cx="30" cy="22" r="6" fill="#ef4444"/>
    <circle cx="50" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="22" r="6" fill="#10b981"/>
    
    <!-- URL -->
    <rect x="250" y="10" width="540" height="24" rx="6" fill="#0f1117" stroke="#2e3348" stroke-width="1"/>
    <text x="520" y="26" font-family="monospace" font-size="11" fill="#9aa0b4" text-anchor="middle">https://converter.hichemmadina.workers.dev</text>
    
    <!-- Converter Header Inside -->
    <g transform="translate(0, 65)">
      <text x="520" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#e8eaf2" text-anchor="middle">WebP <tspan fill="url(#indigoGrad)">Converter</tspan></text>
      <text x="520" y="58" font-family="sans-serif" font-size="13" fill="#9aa0b4" text-anchor="middle">أداة سحابية فائقة السرعة لتحويل وضغط الصور بأعلى جودة — مبنية على Cloudflare Workers</text>
    </g>
    
    <!-- Drag & Drop Zone -->
    <g transform="translate(120, 150)">
      <rect width="800" height="150" rx="14" fill="#1a1d27" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 6" opacity="0.9"/>
      
      <!-- Upload Cloud Icon -->
      <circle cx="400" cy="48" r="26" fill="#242836"/>
      <path d="M390,52 L400,42 L410,52 M400,43 L400,60" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <text x="400" y="100" font-family="sans-serif" font-weight="bold" font-size="16" fill="#f8fafc" text-anchor="middle">اسحب وأفلت الصور هنا أو تصفح ملفاتك</text>
      <text x="400" y="125" font-family="sans-serif" font-size="12" fill="#9aa0b4" text-anchor="middle">يدعم PNG, JPG, JPEG, GIF مع تحويل فوري إلى WebP بدون انتظار</text>
    </g>
    
    <!-- Active File Conversions List -->
    <g transform="translate(120, 325)">
      <!-- Item 1 -->
      <rect width="800" height="65" rx="10" fill="#1a1d27" stroke="#2e3348" stroke-width="1"/>
      <rect x="15" y="12" width="42" height="42" rx="8" fill="#242836"/>
      <text x="36" y="38" font-family="sans-serif" font-size="18" text-anchor="middle">🖼️</text>
      
      <text x="75" y="30" font-family="monospace" font-weight="600" font-size="14" fill="#e8eaf2">hero-landing-banner.png</text>
      <text x="75" y="48" font-family="sans-serif" font-size="11" fill="#9aa0b4">الحجم الأصلي: 4.8 MB → تم التحويل إلى 410 KB</text>
      
      <!-- Pill Savings -->
      <rect x="520" y="20" width="110" height="26" rx="13" fill="#10b981" opacity="0.2"/>
      <text x="575" y="37" font-family="sans-serif" font-weight="bold" font-size="11" fill="#34d399" text-anchor="middle">وفّر 91.5% ⚡</text>
      
      <!-- Download btn -->
      <rect x="660" y="17" width="125" height="32" rx="8" fill="url(#indigoGrad)"/>
      <text x="722" y="38" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">تحميل WebP</text>
      
      <!-- Item 2 -->
      <g transform="translate(0, 75)">
        <rect width="800" height="65" rx="10" fill="#1a1d27" stroke="#2e3348" stroke-width="1"/>
        <rect x="15" y="12" width="42" height="42" rx="8" fill="#242836"/>
        <text x="36" y="38" font-family="sans-serif" font-size="18" text-anchor="middle">📸</text>
        
        <text x="75" y="30" font-family="monospace" font-weight="600" font-size="14" fill="#e8eaf2">product-showcase-4k.jpg</text>
        <text x="75" y="48" font-family="sans-serif" font-size="11" fill="#9aa0b4">الحجم الأصلي: 7.2 MB → تم التحويل إلى 680 KB</text>
        
        <rect x="520" y="20" width="110" height="26" rx="13" fill="#10b981" opacity="0.2"/>
        <text x="575" y="37" font-family="sans-serif" font-weight="bold" font-size="11" fill="#34d399" text-anchor="middle">وفّر 90.6% ⚡</text>
        
        <rect x="660" y="17" width="125" height="32" rx="8" fill="url(#indigoGrad)"/>
        <text x="722" y="38" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">تحميل WebP</text>
      </g>
    </g>
    
    <!-- Footer metrics inside mockup -->
    <g transform="translate(120, 495)">
      <text x="0" y="20" font-family="monospace" font-size="11" fill="#818cf8">⚡ Deployed on Cloudflare Workers (Edge Serverless)</text>
      <text x="800" y="20" font-family="monospace" font-size="11" fill="#9aa0b4" text-anchor="end">By Hichem Madina • Zero Server Storage Policy</text>
    </g>
  </g>
</svg>