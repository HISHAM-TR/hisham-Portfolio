<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#060a17"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200"/>
    <path d="M100,0 V675 M200,0 V675 M300,0 V675 M400,0 V675 M500,0 V675 M600,0 V675 M700,0 V675 M800,0 V675 M900,0 V675 M1000,0 V675 M1100,0 V675"/>
  </g>
  
  <!-- Glow Orbs -->
  <circle cx="950" cy="150" r="220" fill="#0284c7" opacity="0.25" filter="url(#glow)"/>
  <circle cx="200" cy="500" r="200" fill="#d97706" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Browser Window Mockup -->
  <g transform="translate(80, 50)">
    <!-- Window Frame -->
    <rect width="1040" height="575" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.95"/>
    
    <!-- Titlebar -->
    <rect width="1040" height="44" rx="16" fill="#1e293b"/>
    <rect y="24" width="1040" height="20" fill="#1e293b"/>
    <line x1="0" y1="44" x2="1040" y2="44" stroke="#334155" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="30" cy="22" r="6" fill="#ef4444"/>
    <circle cx="50" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="22" r="6" fill="#10b981"/>
    
    <!-- Address Bar -->
    <rect x="220" y="10" width="600" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="520" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">https://www.basmatandalusia.cc</text>
    
    <!-- Nav inside mockup -->
    <g transform="translate(50, 70)">
      <text x="940" y="25" font-family="sans-serif" font-weight="bold" font-size="20" fill="#38bdf8" text-anchor="end">بصمة أندلسية ✨</text>
      <text x="400" y="24" font-family="sans-serif" font-size="13" fill="#94a3b8">الرئيسية   خدماتنا   أعمالنا   فلسفتنا   تواصل معنا</text>
      <rect x="0" y="5" width="110" height="30" rx="15" fill="url(#cyanGrad)"/>
      <text x="55" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ابدأ مشروعك</text>
    </g>
    
    <!-- Hero inside mockup -->
    <g transform="translate(50, 130)">
      <!-- Badge -->
      <rect x="700" y="0" width="240" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="920" cy="15" r="4" fill="#10b981"/>
      <text x="815" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">حلول رقمية متكاملة وتطوير ويب</text>
      
      <!-- Headline -->
      <text x="940" y="70" font-family="sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="end">نبني تجارب رقمية استثنائية</text>
      <text x="940" y="115" font-family="sans-serif" font-weight="800" font-size="34" fill="url(#cyanGrad)" text-anchor="end">تجمع بين الإتقان الهندسي والجمال الأصيل</text>
      
      <!-- Subtext -->
      <text x="940" y="160" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="end">تطوير المواقع، تطبيقات الويب المتقدمة، وتصميم واجهات المستخدم (UI/UX) بأحدث التقنيات</text>
      
      <!-- Buttons -->
      <rect x="800" y="195" width="140" height="42" rx="10" fill="url(#cyanGrad)"/>
      <text x="870" y="222" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">استكشف خدماتنا</text>
      
      <rect x="660" y="195" width="130" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="725" y="222" font-family="sans-serif" font-weight="600" font-size="14" fill="#cbd5e1" text-anchor="middle">معرض أعمالنا</text>
    </g>
    
    <!-- 3 Cards -->
    <g transform="translate(50, 400)">
      <rect x="640" y="0" width="300" height="105" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="920" y="32" font-family="sans-serif" font-weight="bold" font-size="15" fill="#f8fafc" text-anchor="end">⚡ تطوير ويب عالي الأداء</text>
      <text x="920" y="58" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">مواقع سريعة ومعمارية قوية متوافقة مع محركات البحث</text>
      <text x="920" y="85" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="end">React • Next.js • Tailwind CSS</text>
      
      <rect x="320" y="0" width="300" height="105" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="600" y="32" font-family="sans-serif" font-weight="bold" font-size="15" fill="#f8fafc" text-anchor="end">🎨 تصميم واجهات UI/UX</text>
      <text x="600" y="58" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">تجارب مستخدم سلسة وعصرية تحول الزوار لعملاء دائمين</text>
      <text x="600" y="85" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="end">Figma • Interactive Prototypes</text>
      
      <rect x="0" y="0" width="300" height="105" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="280" y="32" font-family="sans-serif" font-weight="bold" font-size="15" fill="#f8fafc" text-anchor="end">☁️ استضافة وحلول سحابية</text>
      <text x="280" y="58" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">أمان وموثوقية فائقة مع سرعة استجابة لا تتجاوز ميلي ثوانٍ</text>
      <text x="280" y="85" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="end">Cloudflare • Edge Workers</text>
    </g>
  </g>
</svg>