<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgStudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120f06"/>
      <stop offset="50%" stop-color="#1f1809"/>
      <stop offset="100%" stop-color="#0a0802"/>
    </linearGradient>
    <linearGradient id="goldStudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="studioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1200" height="675" fill="url(#bgStudio)"/>
  
  <circle cx="950" cy="180" r="240" fill="#eab308" opacity="0.16" filter="url(#studioGlow)"/>
  <circle cx="200" cy="480" r="200" fill="#38bdf8" opacity="0.10" filter="url(#studioGlow)"/>
  
  <!-- Browser Window Mockup -->
  <g transform="translate(80, 50)">
    <rect width="1040" height="575" rx="16" fill="#13110a" stroke="#3d3319" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="1040" height="44" rx="16" fill="#241e0e"/>
    <rect y="24" width="1040" height="20" fill="#241e0e"/>
    <line x1="0" y1="44" x2="1040" y2="44" stroke="#3d3319" stroke-width="1"/>
    
    <circle cx="30" cy="22" r="6" fill="#ef4444"/>
    <circle cx="50" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="22" r="6" fill="#10b981"/>
    
    <!-- URL -->
    <rect x="250" y="10" width="540" height="24" rx="6" fill="#13110a" stroke="#3d3319" stroke-width="1"/>
    <text x="520" y="26" font-family="monospace" font-size="11" fill="#ca8a04" text-anchor="middle">https://studio.basmatandalusia.cc</text>
    
    <!-- Nav inside mockup -->
    <g transform="translate(50, 68)">
      <text x="940" y="25" font-family="sans-serif" font-weight="bold" font-size="20" fill="url(#goldStudio)" text-anchor="end">استوديو الحرم 🎙️</text>
      <text x="400" y="24" font-family="sans-serif" font-size="13" fill="#a1a1aa">منصة إدارة التسجيلات الصوتية والمصاحف</text>
      <rect x="0" y="5" width="120" height="30" rx="15" fill="url(#goldStudio)"/>
      <text x="60" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">طلب اشتراك</text>
    </g>
    
    <!-- Hero Headline inside -->
    <g transform="translate(50, 130)">
      <rect x="740" y="0" width="200" height="28" rx="14" fill="#262010" stroke="#eab308" stroke-width="1"/>
      <circle cx="925" cy="14" r="4" fill="#eab308"/>
      <text x="835" y="19" font-family="sans-serif" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">المنصة الأولى سحابياً 🌟</text>
      
      <text x="940" y="65" font-family="sans-serif" font-weight="800" font-size="32" fill="#ffffff" text-anchor="end">من صوت القارئ</text>
      <text x="940" y="105" font-family="sans-serif" font-weight="800" font-size="32" fill="url(#goldStudio)" text-anchor="end">إلى النشر والمستحقات، في مكان واحد</text>
      
      <text x="940" y="145" font-family="sans-serif" font-size="14" fill="#a1a1aa" text-anchor="end">أدر القرّاء ومراحل التسجيل والتصحيح والمونتاج والمستحقات المالية بكفاءة فائقة</text>
    </g>
    
    <!-- Interactive Audio Pipeline Card inside Mockup -->
    <g transform="translate(50, 310)">
      <rect width="940" height="200" rx="14" fill="#1c170d" stroke="#3d3319" stroke-width="1"/>
      
      <!-- Track Header -->
      <circle cx="890" cy="40" r="20" fill="#2d230e"/>
      <polygon points="887,32 897,40 887,48" fill="#facc15"/>
      <text x="850" y="36" font-family="sans-serif" font-weight="bold" font-size="16" fill="#fef08a" text-anchor="end">سورة الكهف — بصوت القارئ (جلسة رقم 14)</text>
      <text x="850" y="55" font-family="sans-serif" font-size="12" fill="#a1a1aa" text-anchor="end">المصحف المرتل • جودة الاستوديو 96kHz / 24-bit Flac</text>
      
      <!-- Waveform graphic representation -->
      <g transform="translate(40, 80)">
        <rect x="0" y="10" width="860" height="40" rx="8" fill="#131008"/>
        <!-- Simulated dynamic sound waves -->
        <g fill="#eab308" opacity="0.85">
          <rect x="30" y="22" width="4" height="16" rx="2"/><rect x="40" y="18" width="4" height="24" rx="2"/><rect x="50" y="14" width="4" height="32" rx="2"/><rect x="60" y="20" width="4" height="20" rx="2"/>
          <rect x="70" y="25" width="4" height="10" rx="2"/><rect x="80" y="16" width="4" height="28" rx="2"/><rect x="90" y="12" width="4" height="36" rx="2"/><rect x="100" y="20" width="4" height="20" rx="2"/>
          <rect x="110" y="24" width="4" height="12" rx="2"/><rect x="120" y="15" width="4" height="30" rx="2"/><rect x="130" y="10" width="4" height="40" rx="2"/><rect x="140" y="18" width="4" height="24" rx="2"/>
          <rect x="150" y="22" width="4" height="16" rx="2"/><rect x="160" y="12" width="4" height="36" rx="2"/><rect x="170" y="14" width="4" height="32" rx="2"/><rect x="180" y="25" width="4" height="10" rx="2"/>
          <rect x="190" y="20" width="4" height="20" rx="2"/><rect x="200" y="10" width="4" height="40" rx="2"/><rect x="210" y="16" width="4" height="28" rx="2"/><rect x="220" y="22" width="4" height="16" rx="2"/>
          <rect x="230" y="14" width="4" height="32" rx="2"/><rect x="240" y="18" width="4" height="24" rx="2"/><rect x="250" y="25" width="4" height="10" rx="2"/><rect x="260" y="12" width="4" height="36" rx="2"/>
          <!-- Progress cursor -->
          <line x1="280" y1="5" x2="280" y2="55" stroke="#ffffff" stroke-width="2"/>
          <circle cx="280" cy="5" r="4" fill="#ffffff"/>
        </g>
        <g fill="#524320" opacity="0.5">
          <rect x="290" y="20" width="4" height="20" rx="2"/><rect x="300" y="15" width="4" height="30" rx="2"/><rect x="310" y="25" width="4" height="10" rx="2"/><rect x="320" y="12" width="4" height="36" rx="2"/>
          <rect x="330" y="18" width="4" height="24" rx="2"/><rect x="340" y="22" width="4" height="16" rx="2"/><rect x="350" y="14" width="4" height="32" rx="2"/><rect x="360" y="20" width="4" height="20" rx="2"/>
          <rect x="370" y="24" width="4" height="12" rx="2"/><rect x="380" y="10" width="4" height="40" rx="2"/><rect x="390" y="16" width="4" height="28" rx="2"/><rect x="400" y="22" width="4" height="16" rx="2"/>
        </g>
      </g>
      
      <!-- 4 Stages Pipeline Status -->
      <g transform="translate(40, 150)">
        <rect x="680" y="0" width="180" height="32" rx="6" fill="#10b981" opacity="0.2"/>
        <text x="770" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">✓ مرحلة التسجيل (مكتمل)</text>
        
        <rect x="480" y="0" width="180" height="32" rx="6" fill="#3b82f6" opacity="0.2"/>
        <text x="570" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">✓ التدقيق اللغوي والتجويد</text>
        
        <rect x="280" y="0" width="180" height="32" rx="6" fill="#f59e0b" opacity="0.2"/>
        <text x="370" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">⚙️ مرحلة المونتاج والماسترينغ</text>
        
        <rect x="80" y="0" width="180" height="32" rx="6" fill="#6b7280" opacity="0.2"/>
        <text x="170" y="20" font-family="sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">⏳ جدولة النشر والتوزيع</text>
      </g>
    </g>
  </g>
</svg>